[versions]
# Android SDK versions
# https://developer.android.com/about/versions
compileSdk = "36"
targetSdk = "36"
minSdk = "28"

activityCompose = "1.13.0"
# https://developer.android.com/build/releases/gradle-plugin
# AGP 9.1 requires Gradle 9.3.1 or higher
agp = "9.2.1"

circuit = "0.33.1"
composeBom = "2026.05.00"
coreKtx = "1.18.0"
espressoCore = "3.7.0"
googleFonts = "1.11.1"
junit = "4.13.2"
junitVersion = "1.3.0"

# https://kotlinlang.org/docs/releases.html
kotlin = "2.3.21"
# The KSP (Kotlin Symbol Processing) plugin version is managed separately in this template.
# When upgrading Kotlin or KSP, verify that the selected KSP release is compatible with the configured Kotlin version.
ksp = "2.3.7"

# Kotlin linter with built-in formatter
# https://github.com/jeremymailen/kotlinter-gradle
# https://github.com/pinterest/ktlint
kotlinter = "5.4.2"
lifecycleRuntimeKtx = "2.10.0"
metro = "1.0.0"
androidxWebkit = "1.16.0"

# https://github.com/hossain-khan/android-compose-highlight
composeHighlight = "0.16.0"

# https://github.com/ivan-magda/kotlin-textmate
kotlinTextmate = "0.1.0"

# https://github.com/hossain-khan/shiki-token-service/blob/main/sdk/README.md
shikiSdk = "sdk-1.0.5"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

# Circuit - ⚡️A Compose-driven architecture for Kotlin and Android applications.
# https://github.com/slackhq/circuit/releases
# Note: circuit-codegen KSP processor is no longer needed; Metro provides built-in Circuit codegen
# via enableCircuitCodegen. The circuit-codegen-annotations artifact is also added automatically.
circuit-foundation = { group = "com.slack.circuit", name = "circuit-foundation", version.ref = "circuit" }
circuit-overlay = { group = "com.slack.circuit", name = "circuit-overlay", version.ref = "circuit" }
circuit-test = { group = "com.slack.circuit", name = "circuit-test", version.ref = "circuit" }
circuitx-android = { group = "com.slack.circuit", name = "circuitx-android", version.ref = "circuit" }
circuitx-effects = { group = "com.slack.circuit", name = "circuitx-effects", version.ref = "circuit" }
circuitx-gestureNav = { group = "com.slack.circuit", name = "circuitx-gesture-navigation", version.ref = "circuit" }
circuitx-overlays = { group = "com.slack.circuit", name = "circuitx-overlays", version.ref = "circuit" }

javax-inject = { group = "javax.inject", name = "javax.inject", version = "1" }

# # https://developer.android.com/develop/ui/compose/text/fonts
# https://mvnrepository.com/artifact/androidx.compose.ui/ui-text-google-fonts
androidx-ui-text-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts", version.ref = "googleFonts" }

# WebKit - https://developer.android.com/jetpack/androidx/releases/webkit
# Required for WebView pre-warming (WebViewCompat.startUpWebView) used by compose-highlight
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "androidxWebkit" }

# Shiki Token Service SDK - server-driven syntax highlighting
# https://github.com/hossain-khan/shiki-token-service/blob/main/sdk/README.md
shiki-sdk = { group = "com.github.hossain-khan.shiki-token-service", name = "sdk-android", version.ref = "shikiSdk" }

# compose-highlight - on-device syntax highlighting via Highlight.js WebView
# https://github.com/hossain-khan/android-compose-highlight
compose-highlight = { group = "dev.hossain", name = "compose-highlight", version.ref = "composeHighlight" }

# kotlin-textmate - on-device TextMate grammar-based syntax highlighting
# https://github.com/ivan-magda/kotlin-textmate
kotlin-textmate-compose = { group = "io.github.ivan-magda", name = "kotlin-textmate-compose", version.ref = "kotlinTextmate" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# kotlin-android plugin is no longer needed with AGP 9.1+ (built-in Kotlin support)
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }

# Kotlin Symbol Processing API
# https://kotlinlang.org/docs/ksp-overview.html
# https://github.com/google/ksp/releases
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp"}

# Metro KSP plugin
# https://zacsweers.github.io/metro/
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }

# Kotlin linter with built-in formatter
# https://github.com/jeremymailen/kotlinter-gradle
# https://github.com/pinterest/ktlint
kotlinter = { id = "org.jmailen.kotlinter", version.ref = "kotlinter" }


